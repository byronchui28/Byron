<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #e2e8f0;
      --success: #28a745;
      --danger: #dc3545;
      --warning-bg: #fff3cd;
      --warning-border: #ffeeba;
      --warning-text: #856404;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #7f8c8d;
      font-size: 14px;
      margin-top: -15px;
      margin-bottom: 20px;
    }

    /* Tab 導航 */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .tab-btn {
      padding: 12px 28px;
      border: none;
      background: #e9ecef;
      color: #495057;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      background: #dee2e6;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* 控制列 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
    }

    select, button {
      padding: 9px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    /* 網格與卡片 */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .word-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .word-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .word-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .audio-icon-btn {
      border: none;
      background: #edf2f7;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .audio-icon-btn:hover {
      background: #e2e8f0;
    }

    .sentence-index {
      font-size: 12px;
      color: #a0aec0;
      font-weight: bold;
    }

    .meaning {
      font-size: 15px;
      color: #4a5568;
    }

    /* 測試卡片 */
    .test-card {
      text-align: center;
      padding: 35px 20px;
      background: #fafafa;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .test-prompt {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }

    .score-display {
      font-size: 20px;
      font-weight: 700;
      margin-top: 20px;
    }

    .rec-status {
      font-size: 15px;
      color: #718096;
      margin-top: 10px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    @media (max-width: 640px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      padding: 16px;
      font-size: 16px;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #f0f7ff;
    }

    .option-btn.correct {
      background: #d4edda !important;
      border-color: var(--success) !important;
      color: #155724;
      font-weight: 600;
    }

    .option-btn.wrong {
      background: #f8d7da !important;
      border-color: var(--danger) !important;
      color: #721c24;
    }

    .correction-box {
      margin-top: 20px;
      padding: 18px;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 10px;
      color: var(--warning-text);
      display: inline-block;
      max-width: 100%;
    }

    .mic-recording {
      animation: pulse 1.5s infinite;
      background-color: var(--danger) !important;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }
  </style>
</head>

<div class="container">
  <h1>常用英語口語 1000 句</h1>
  <div class="subtitle">全功能專業口語學習与發音測試系統</div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">📚 學習模式</button>
    <button class="tab-btn" onclick="switchTab('test')">📝 測試模式</button>
  </div>

  <!-- 學習模式 Panel -->
  <div id="learn-panel" class="panel active">
    <div class="controls">
      <div class="control-group">
        <label>選擇課程：</label>
        <select id="lesson-select" onchange="renderWords()"></select>
      </div>
      <div class="control-group">
        <label>口音選擇：</label>
        <select id="accent-select">
          <option value="en-US" selected>🇺🇸 美音 (American)</option>
          <option value="en-GB">🇬🇧 英音 (British)</option>
        </select>
      </div>
      <div class="control-group">
        <label>發音語速：</label>
        <select id="rate-select">
          <option value="1">1.0x (正常)</option>
          <option value="0.75">0.75x (稍慢)</option>
          <option value="0.5">0.5x (慢速)</option>
          <option value="0.25">0.25x (極慢)</option>
        </select>
      </div>
    </div>
    <div id="word-container" class="word-grid"></div>
  </div>

  <!-- 測試模式 Panel -->
  <div id="test-panel" class="panel">
    <div class="controls">
      <div class="control-group">
        <label>從：</label>
        <select id="test-start"></select>
      </div>
      <div class="control-group">
        <label>到：</label>
        <select id="test-end"></select>
      </div>
      <div class="control-group">
        <label>模式：</label>
        <select id="test-mode" onchange="resetTestArea()">
          <option value="1">模式 1：看中文發音英文 (AI語音評分 1-10分)</option>
          <option value="2">模式 2：聽英文選中文 (4選1測試)</option>
          <option value="3">模式 3：看中文選英文 (4選1測試)</option>
        </select>
      </div>
      <button class="btn-action" onclick="startTest()">開始測試</button>
    </div>

    <div id="test-area" class="test-card" style="display:none;">
      <div id="test-prompt" class="test-prompt">---</div>
      <button id="listen-btn" class="btn-action" style="display:none; margin-bottom:15px;" onclick="playTestAudio()">🔊 重新播放發音</button>

      <div id="mode1-controls">
        <button id="mic-btn" class="btn-action" onclick="toggleRecognition()">🎤 開始回答 (錄音)</button>
        <div id="rec-status" class="rec-status">點擊麥克風按鈕開始作答...</div>
      </div>

      <div id="options-container" class="options-grid" style="display:none;"></div>

      <div id="test-result" class="score-display"></div>
      
      <!-- 低於 6 分時顯示的正確發音輔導區 -->
      <div id="correction-area" class="correction-box" style="display:none;">
        <div>標準英文：<strong id="correct-word-text" style="font-size:18px;"></strong></div>
        <button class="btn-action" style="margin-top:10px;" onclick="playCorrectAudio()">🔊 點擊收聽正確標準發音</button>
      </div>

      <div>
        <button class="btn-action" style="margin-top: 25px;" onclick="nextQuestion()">下一題 ➔</button>
      </div>
    </div>
  </div>
</div>

// 自動將 1000 句分爲 50 課，每課 20 句
const lessonsData = {};
const LESSON_SIZE = 20;
const totalLessons = Math.ceil(rawSentences.length / LESSON_SIZE);

for (let i = 1; i <= totalLessons; i++) {
  lessonsData[i] = rawSentences.slice((i - 1) * LESSON_SIZE, i * LESSON_SIZE);
}

let allWordsPool = [...rawSentences];
let currentTestPool = [];
let currentQIndex = 0;
let isListening = false;
let recognition = null;
let optionAnswered = false;
let cachedVoices = [];

function loadVoices() {
  if ('speechSynthesis' in window) {
    cachedVoices = window.speechSynthesis.getVoices();
  }
}

if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

window.onload = () => {
  const lessonSelect = document.getElementById('lesson-select');
  const startSelect = document.getElementById('test-start');
  const endSelect = document.getElementById('test-end');

  for (let l = 1; l <= totalLessons; l++) {
    lessonSelect.add(new Option(`第 ${l} 課 (句 ${ (l-1)*20+1 } - ${ Math.min(l*20, 1000) })`, l));
    startSelect.add(new Option(`第 ${l} 課`, l));
    endSelect.add(new Option(`第 ${l} 課`, l));
  }

  // 預設測試結尾爲第 5 課
  if (endSelect.options.length >= 5) {
    endSelect.selectedIndex = 4;
  }

  renderWords();
  initSpeechRecognition();
};

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  if(tab === 'learn') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('learn-panel').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('test-panel').classList.add('active');
  }
}

function resetTestArea() {
  document.getElementById('test-area').style.display = 'none';
}

function getBestVoice(targetLang) {
  if (!cachedVoices || cachedVoices.length === 0) {
    cachedVoices = window.speechSynthesis.getVoices();
  }
  let voice = cachedVoices.find(v => v.lang.replace('_', '-') === targetLang);
  if (!voice) {
    const langPrefix = targetLang.split('-')[0];
    voice = cachedVoices.find(v => v.lang.startsWith(langPrefix));
  }
  return voice || null;
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert("您的瀏覽器不支援語音合成功能");
    return;
  }
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  const accent = document.getElementById('accent-select').value || 'en-US';
  let rate = parseFloat(document.getElementById('rate-select').value || 1);

  utterance.lang = accent;
  utterance.rate = rate;

  const matchedVoice = getBestVoice(accent);
  if (matchedVoice) {
    utterance.voice = matchedVoice;
  }

  window.speechSynthesis.speak(utterance);
}

function renderWords() {
  const lesson = document.getElementById('lesson-select').value;
  const container = document.getElementById('word-container');
  container.innerHTML = '';

  const list = lessonsData[lesson] || [];
  if(list.length === 0) {
    container.innerHTML = '<p>該課程暫無數據</p>';
    return;
  }

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = `
      <div class="word-header">
        <div class="word-title">${item.word}</div>
        <button class="audio-icon-btn" onclick="speak('${escapeQuote(item.word)}')" title="點擊朗讀">🔊</button>
      </div>
      <div class="meaning">釋義：${item.meaning}</div>
      <div class="sentence-index">句號：#${item.id}</div>
    `;
    container.appendChild(card);
  });
}

function escapeQuote(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('rec-status').innerText = "您的瀏覽器不支援語音識別功能 (建議使用 Chrome / Edge 瀏覽器)";
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript.trim();
    document.getElementById('rec-status').innerText = `識別結果: "${transcript}"`;
    evaluateAnswer(transcript);
  };

  recognition.onerror = (event) => {
    document.getElementById('rec-status').innerText = `識別失敗或無聲音: ${event.error}`;
    stopMicUI();
  };

  recognition.onend = () => {
    stopMicUI();
  };
}

function stopMicUI() {
  isListening = false;
  const btn = document.getElementById('mic-btn');
  btn.innerText = "🎤 開始回答 (錄音)";
  btn.classList.remove('mic-recording');
}

function toggleRecognition() {
  if (!recognition) {
    alert("您的瀏覽器未支援 Web Speech API 語音識別功能。");
    return;
  }
  const accent = document.getElementById('accent-select').value;
  recognition.lang = accent;

  if (isListening) {
    recognition.stop();
    stopMicUI();
  } else {
    try {
      recognition.start();
      isListening = true;
      const btn = document.getElementById('mic-btn');
      btn.innerText = "🛑 正在聆聽中...點擊結束";
      btn.classList.add('mic-recording');
      document.getElementById('rec-status').innerText = "請清晰地讀出英文句子...";
    } catch(e) {
      console.error(e);
    }
  }
}

function startTest() {
  const start = parseInt(document.getElementById('test-start').value);
  const end = parseInt(document.getElementById('test-end').value);
  
  currentTestPool = [];
  for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
    if (lessonsData[i]) {
      currentTestPool.push(...lessonsData[i]);
    }
  }

  if (currentTestPool.length === 0) {
    alert("選擇的課程範圍內沒有可測試的句子！");
    return;
  }

  currentTestPool.sort(() => Math.random() - 0.5);
  currentQIndex = 0;
  document.getElementById('test-area').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  if (currentQIndex >= currentTestPool.length) {
    document.getElementById('test-prompt').innerText = "🎉 測試完成！恭喜完成本組練習！";
    document.getElementById('test-result').innerText = "";
    document.getElementById('listen-btn').style.display = 'none';
    document.getElementById('mode1-controls').style.display = 'none';
    document.getElementById('options-container').style.display = 'none';
    document.getElementById('correction-area').style.display = 'none';
    return;
  }

  const q = currentTestPool[currentQIndex];
  const mode = document.getElementById('test-mode').value;
  document.getElementById('test-result').innerText = "";
  document.getElementById('correction-area').style.display = 'none';
  optionAnswered = false;

  if (mode === '1') {
    document.getElementById('test-prompt').innerText = q.meaning;
    document.getElementById('listen-btn').style.display = 'none';
    document.getElementById('mode1-controls').style.display = 'block';
    document.getElementById('options-container').style.display = 'none';
    document.getElementById('rec-status').innerText = "點擊麥克風按鈕開始作答...";
  } else if (mode === '2') {
    document.getElementById('test-prompt').innerText = "🎧 請聽發音選擇正確中文釋義";
    document.getElementById('listen-btn').style.display = 'inline-block';
    document.getElementById('mode1-controls').style.display = 'none';
    document.getElementById('options-container').style.display = 'grid';

    generateOptions(q, 'meaning');
    playTestAudio();
  } else if (mode === '3') {
    document.getElementById('test-prompt').innerText = q.meaning;
    document.getElementById('listen-btn').style.display = 'none';
    document.getElementById('mode1-controls').style.display = 'none';
    document.getElementById('options-container').style.display = 'grid';

    generateOptions(q, 'word');
  }
}

function generateOptions(correctQ, displayField) {
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  let options = [correctQ];
  let poolToDistract = allWordsPool.length >= 4 ? allWordsPool : currentTestPool;
  let candidates = poolToDistract.filter(item => item.id !== correctQ.id);
  candidates.sort(() => Math.random() - 0.5);

  for(let i = 0; i < Math.min(3, candidates.length); i++) {
    options.push(candidates[i]);
  }

  options.sort(() => Math.random() - 0.5);

  options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt[displayField]}`;
    btn.onclick = () => checkOption(btn, opt.id === correctQ.id, correctQ[displayField]);
    container.appendChild(btn);
  });
}

function checkOption(selectedBtn, isCorrect, correctAnswerText) {
  if (optionAnswered) return;
  optionAnswered = true;

  const resultDiv = document.getElementById('test-result');
  const allBtns = document.querySelectorAll('.option-btn');

  if (isCorrect) {
    selectedBtn.classList.add('correct');
    resultDiv.style.color = '#28a745';
    resultDiv.innerText = '結果：✅ 回答正確！';
    
    if (document.getElementById('test-mode').value === '3') {
      playTestAudio();
    }
  } else {
    selectedBtn.classList.add('wrong');
    resultDiv.style.color = '#dc3545';
    resultDiv.innerText = `結果：❌ 回答錯誤！`;
    
    allBtns.forEach(btn => {
      if (btn.innerText.includes(correctAnswerText)) {
        btn.classList.add('correct');
      }
    });
  }
}

function playTestAudio() {
  const q = currentTestPool[currentQIndex];
  speak(q.word);
}

function playCorrectAudio() {
  const q = currentTestPool[currentQIndex];
  speak(q.word);
}

// Levenshtein 距離演算法 (忽略大小寫和符號)
function cleanText(str) {
  return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

function getLevenshteinDistance(a, b) {
  const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
  for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + cost
      );
    }
  }
  return matrix[a.length][b.length];
}

function evaluateAnswer(userSpeech) {
  const q = currentTestPool[currentQIndex];
  const resultDiv = document.getElementById('test-result');
  const correctionArea = document.getElementById('correction-area');
  
  const target = cleanText(q.word);
  const input = cleanText(userSpeech);

  if (input === target) {
    resultDiv.style.color = '#28a745';
    resultDiv.innerText = `得分：10 / 10 分 (完美！發音非常標準)`;
    correctionArea.style.display = 'none';
    return;
  }

  const distance = getLevenshteinDistance(input, target);
  const maxLength = Math.max(input.length, target.length);
  const similarity = maxLength === 0 ? 0 : (1 - distance / maxLength);

  let score = 1;

  if (similarity >= 0.90) {
    score = 9;
  } else if (similarity >= 0.80) {
    score = 8;
  } else if (similarity >= 0.70) {
    score = 7;
  } else if (similarity >= 0.60) {
    score = 6;
  } else if (similarity >= 0.45) {
    score = 4;
  } else if (similarity >= 0.25) {
    score = 2;
  } else {
    score = 1;
  }

  if (score >= 6) {
    resultDiv.style.color = '#28a745';
    resultDiv.innerText = `得分：${score} / 10 分 (發音基本合格)`;
    correctionArea.style.display = 'none';
  } else {
    resultDiv.style.color = '#dc3545';
    resultDiv.innerText = `得分：${score} / 10 分 (不合格！發音偏差較大)`;
    
    document.getElementById('correct-word-text').innerText = q.word;
    correctionArea.style.display = 'inline-block';
  }
}

function nextQuestion() {
  currentQIndex++;
  loadQuestion();
}
