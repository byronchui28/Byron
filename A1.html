<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅思 A1 高頻詞彙學習與語音測試遊戲</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 25px;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      font-size: 16px;
      border-radius: 8px;
      transition: 0.3s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    select, button {
      padding: 8px 12px;
      font-size: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .word-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .word-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .pos-tag { font-size: 12px; background: #eef2f7; padding: 2px 6px; border-radius: 4px; color: #4a5568; margin-left: 6px; }
    .syllable { font-size: 12px; color: #888; margin-left: 4px; }
    .example-box { font-size: 13px; color: #555; background: #f9f9f9; padding: 8px; border-left: 3px solid var(--primary); border-radius: 0 4px 4px 0; margin-top: 4px; }

    .test-card {
      text-align: center;
      padding: 30px;
      background: #fafafa;
      border-radius: 10px;
      margin-top: 20px;
    }
    .test-prompt { font-size: 26px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
    .score-display { font-size: 20px; font-weight: bold; margin-top: 15px; }
    .rec-status { font-size: 14px; color: #7f8c8d; margin-top: 5px; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .option-btn {
      padding: 15px;
      font-size: 16px;
      background: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
    }
    .option-btn:hover {
      border-color: var(--primary);
      background: #f0f7ff;
    }
    .option-btn.correct {
      background: #d4edda !important;
      border-color: #28a745 !important;
      color: #155724;
    }
    .option-btn.wrong {
      background: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24;
    }

    .correction-box {
      margin-top: 15px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      color: #856404;
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>雅思 A1 高頻詞彙學習與語音測試遊戲</h1>
  <div class="subtitle">Will's English Workshop - 雅思生活技能 A1 級別高頻詞彙庫</div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('learn')">📚 學習模式</button>
    <button class="tab-btn" onclick="switchTab('test')">📝 測試模式</button>
  </div>

  <div id="learn-panel" class="panel active">
    <div class="controls">
      <label>選擇主題課程：
        <select id="lesson-select" onchange="renderWords()"></select>
      </label>
      <label>口音選擇：
        <select id="accent-select">
          <option value="en-GB" selected>🇬🇧 英音 (British)</option>
          <option value="en-US">🇺🇸 美音 (American)</option>
        </select>
      </label>
      <label>發音語速：
        <select id="rate-select">
          <option value="1">1.0x (正常)</option>
          <option value="0.5">0.5x (慢速)</option>
          <option value="0.25">0.25x (極慢)</option>
        </select>
      </label>
    </div>
    <div id="word-container" class="word-grid"></div>
  </div>

  <div id="test-panel" class="panel">
    <div class="controls">
      <label>從：<select id="test-start"></select></label>
      <label>到：<select id="test-end"></select></label>
      <label>模式：
        <select id="test-mode" onchange="resetTestArea()">
          <option value="1">模式 1：看中文發音英文 (專業高標準評分)</option>
          <option value="2">模式 2：聽英文選中文 (4選1對錯)</option>
          <option value="3">模式 3：看中文選英文 (4選1對錯)</option>
        </select>
      </label>
      <button class="btn-action" onclick="startTest()">開始測試</button>
    </div>

    <div id="test-area" class="test-card" style="display:none;">
      <div id="test-prompt" class="test-prompt">---</div>
      <div id="test-phonetic" style="margin-bottom: 15px;"></div>
      <button id="listen-btn" class="btn-action" style="display:none; margin-bottom:15px;" onclick="playTestAudio()">🔊 重新播放發音</button>

      <div id="mode1-controls">
        <button id="mic-btn" class="btn-action" onclick="toggleRecognition()">🎤 開始回答 (錄音)</button>
        <div id="rec-status" class="rec-status">點擊麥克風按鈕開始作答...</div>
      </div>

      <div id="options-container" class="options-grid" style="display:none;"></div>

      <div id="test-result" class="score-display"></div>
      
      <!-- 低於 6 分時顯示的正確發音輔導區 -->
      <div id="correction-area" class="correction-box" style="display:none;">
        <div>標準單詞：<strong id="correct-word-text"></strong> <span id="correct-phonetic-text" style="color:#e67e22;"></span></div>
        <button class="btn-action" style="margin-top:8px;" onclick="playCorrectAudio()">🔊 點擊收聽正確發音</button>
      </div>

      <div>
        <button class="btn-action" style="margin-top: 20px;" onclick="nextQuestion()">下一題 ➔</button>
      </div>
    </div>
  </div>
</div>

let allWordsPool = [];
let currentTestPool = [];
let currentQIndex = 0;
let isListening = false;
let recognition = null;
let optionAnswered = false;
let cachedVoices = [];

function loadVoices() {
  if ('speechSynthesis' in window) {
    cachedVoices = window.speechSynthesis.getVoices();
  }
}

if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

window.onload = () => {
  const lessonSelect = document.getElementById('lesson-select');
  const startSelect = document.getElementById('test-start');
  const endSelect = document.getElementById('test-end');

  Object.keys(lessonsData).forEach(l => {
    const title = lessonsData[l].title;
    lessonSelect.add(new Option(title, l));
    startSelect.add(new Option(title, l));
    endSelect.add(new Option(title, l));
  });

  Object.values(lessonsData).forEach(group => {
    allWordsPool.push(...group.words);
  });

  renderWords();
  initSpeechRecognition();
};

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  if(tab === 'learn') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('learn-panel').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('test-panel').classList.add('active');
  }
}

function resetTestArea() {
  document.getElementById('test-area').style.display = 'none';
}

function getBestVoice(targetLang) {
  if (!cachedVoices || cachedVoices.length === 0) {
    cachedVoices = window.speechSynthesis.getVoices();
  }
  let voice = cachedVoices.find(v => v.lang.replace('_', '-') === targetLang);
  if (!voice) {
    const langPrefix = targetLang.split('-')[0];
    voice = cachedVoices.find(v => v.lang.startsWith(langPrefix) && v.lang.includes(targetLang.split('-')[1]));
  }
  return voice || null;
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert("您的瀏覽器不支援語音合成功能");
    return;
  }
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  const accent = document.getElementById('accent-select').value || 'en-GB';
  let rate = parseFloat(document.getElementById('rate-select').value || 1);
  
  if (accent === 'en-GB' && rate === 0.25) {
    rate = 0.18;
  }

  utterance.lang = accent;
  utterance.rate = rate;

  const matchedVoice = getBestVoice(accent);
  if (matchedVoice) {
    utterance.voice = matchedVoice;
  }

  window.speechSynthesis.speak(utterance);
}

function renderWords() {
  const lessonKey = document.getElementById('lesson-select').value;
  const container = document.getElementById('word-container');
  container.innerHTML = '';

  const group = lessonsData[lessonKey];
  const list = group ? group.words : [];

  if(list.length === 0) {
    container.innerHTML = '<p>該課程暫無數據</p>';
    return;
  }

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'word-card';
    const syllableText = item.syllables > 0 ? `<span class="syllable">(${item.syllables}音節)</span>` : '';
    card.innerHTML = `
      <div class="word-title">
        ${item.word} 
        <span class="pos-tag">${item.pos}</span>
        ${syllableText}
        <button onclick="speak('${item.word.replace(/'/g, "\\'")}')" style="border:none;background:none;cursor:pointer;font-size:16px;">🔊</button>
      </div>
      <div><strong>釋義：</strong>${item.meaning}</div>
      <div class="example-box"><strong>真題例句：</strong>${item.example}</div>
    `;
    container.appendChild(card);
  });
}

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('rec-status').innerText = "您的瀏覽器不支援語音識別功能 (建議使用 Chrome)";
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript.trim().toLowerCase();
    document.getElementById('rec-status').innerText = `識別結果: "${transcript}"`;
    evaluateAnswer(transcript);
  };

  recognition.onerror = (event) => {
    document.getElementById('rec-status').innerText = `識別失敗: ${event.error}`;
    isListening = false;
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById('mic-btn').innerText = "🎤 開始回答 (錄音)";
  };
}

function toggleRecognition() {
  if (!recognition) return;
  const accent = document.getElementById('accent-select').value;
  recognition.lang = accent;

  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
    isListening = true;
    document.getElementById('mic-btn').innerText = "🛑 正在聆聽中...";
    document.getElementById('rec-status').innerText = "請朗讀英文單詞/句子...";
  }
}

function startTest() {
  const start = parseInt(document.getElementById('test-start').value);
  const end = parseInt(document.getElementById('test-end').value);
  
  currentTestPool = [];
  for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
    if (lessonsData[i] && lessonsData[i].words) {
      currentTestPool.push(...lessonsData[i].words);
    }
  }

  if (currentTestPool.length === 0) {
    alert("選擇的課程範圍內沒有可測試的單詞！");
    return;
  }

  currentTestPool.sort(() => Math.random() - 0.5);
  currentQIndex = 0;
  document.getElementById('test-area').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  if (currentQIndex >= currentTestPool.length) {
    document.getElementById('test-prompt').innerText = "🎉 測試完成！";
    document.getElementById('test-phonetic').innerText = "";
    document.getElementById('test-result').innerText = "";
    document.getElementById('listen-btn').style.display = 'none';
    document.getElementById('mode1-controls').style.display = 'none';
    document.getElementById('options-container').style.display = 'none';
    document.getElementById('correction-area').style.display = 'none';
    return;
  }

  const q = currentTestPool[currentQIndex];
  const mode = document.getElementById('test-mode').value;
  document.getElementById('test-result').innerText = "";
  document.getElementById('correction-area').style.display = 'none';
  optionAnswered = false;

  if (mode === '1') {
    document.getElementById('test-prompt').innerText = q.meaning;
    document.getElementById('test-phonetic').innerText = "";
    document.getElementById('listen-btn').style.display = 'none';
    document.getElementById('mode1-controls').style.display = 'block';
    document.getElementById('options-container').style.display = 'none';
    document.getElementById('rec-status').innerText = "點擊麥克風按鈕開始作答...";
  } else if (mode === '2') {
    document.getElementById('test-prompt').innerText = "🎧 請聽發音選擇正確中文釋義";
    document.getElementById('test-phonetic').innerText = `[${q.pos}]`;
    document.getElementById('listen-btn').style.display = 'inline-block';
    document.getElementById('mode1-controls').style.display = 'none';
    document.getElementById('options-container').style.display = 'grid';

    generateOptions(q, 'meaning');
    playTestAudio();
  } else if (mode === '3') {
    document.getElementById('test-prompt').innerText = q.meaning;
    document.getElementById('test-phonetic').innerText = "";
    document.getElementById('listen-btn').style.display = 'none';
    document.getElementById('mode1-controls').style.display = 'none';
    document.getElementById('options-container').style.display = 'grid';

    generateOptions(q, 'word');
  }
}

function generateOptions(correctQ, displayField) {
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  let options = [correctQ];
  let poolToDistract = allWordsPool.length >= 4 ? allWordsPool : currentTestPool;
  let candidates = poolToDistract.filter(item => item.word !== correctQ.word);
  candidates.sort(() => Math.random() - 0.5);

  for(let i = 0; i < Math.min(3, candidates.length); i++) {
    options.push(candidates[i]);
  }

  options.sort(() => Math.random() - 0.5);

  options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt[displayField]}`;
    btn.onclick = () => checkOption(btn, opt.word === correctQ.word, correctQ[displayField]);
    container.appendChild(btn);
  });
}

function checkOption(selectedBtn, isCorrect, correctAnswerText) {
  if (optionAnswered) return;
  optionAnswered = true;

  const resultDiv = document.getElementById('test-result');
  const allBtns = document.querySelectorAll('.option-btn');

  if (isCorrect) {
    selectedBtn.classList.add('correct');
    resultDiv.style.color = '#28a745';
    resultDiv.innerText = '結果：✅ 回答正確！';
    
    if (document.getElementById('test-mode').value === '3') {
      playTestAudio();
    }
  } else {
    selectedBtn.classList.add('wrong');
    resultDiv.style.color = '#dc3545';
    resultDiv.innerText = `結果：❌ 回答錯誤！(正確答案：${correctAnswerText})`;
    
    allBtns.forEach(btn => {
      if (btn.innerText.includes(correctAnswerText)) {
        btn.classList.add('correct');
      }
    });
  }
}

function playTestAudio() {
  const q = currentTestPool[currentQIndex];
  speak(q.word);
}

function playCorrectAudio() {
  const q = currentTestPool[currentQIndex];
  speak(q.word);
}

function getLevenshteinDistance(a, b) {
  const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
  for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + cost
      );
    }
  }
  return matrix[a.length][b.length];
}

function evaluateAnswer(userSpeech) {
  const q = currentTestPool[currentQIndex];
  const resultDiv = document.getElementById('test-result');
  const correctionArea = document.getElementById('correction-area');
  
  const target = q.word.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
  const input = userSpeech.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();

  if (input === target) {
    resultDiv.style.color = '#28a745';
    resultDiv.innerText = `得分：10 / 10 分 (完美！發音非常標準)`;
    correctionArea.style.display = 'none';
    return;
  }

  const distance = getLevenshteinDistance(input, target);
  const maxLength = Math.max(input.length, target.length);
  const similarity = 1 - (distance / maxLength);

  let score = 1;

  if (similarity >= 0.95) {
    score = 9;
  } else if (similarity >= 0.85) {
    score = 8;
  } else if (similarity >= 0.75) {
    score = 6;
  } else if (similarity >= 0.60) {
    score = 4;
  } else if (similarity >= 0.40) {
    score = 2;
  } else {
    score = 1;
  }

  if (input.length > 0 && target.length > 0) {
    if (input[0] !== target[0]) {
      score = Math.min(score, 3);
    }
  }

  if (score >= 6) {
    resultDiv.style.color = '#28a745';
    resultDiv.innerText = `得分：${score} / 10 分 (發音基本合格)`;
    correctionArea.style.display = 'none';
  } else {
    resultDiv.style.color = '#dc3545';
    resultDiv.innerText = `得分：${score} / 10 分 (不合格！發音偏差較大)`;
    
    document.getElementById('correct-word-text').innerText = q.word;
    document.getElementById('correct-phonetic-text').innerText = `[${q.pos}]`;
    correctionArea.style.display = 'inline-block';
  }
}

function nextQuestion() {
  currentQIndex++;
  loadQuestion();
}
