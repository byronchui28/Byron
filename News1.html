<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球即时新闻看板 (海外加速版)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #1e88e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.5rem; margin: 10px 0 5px 0; }
        p { font-size: 0.85rem; color: #666; margin: 0; }

        .category-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
        }

        .category-btn {
            padding: 8px 16px;
            border: none;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        .news-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .news-title {
            font-size: 1.05rem;
            margin: 0 0 8px 0;
            line-height: 1.4;
            color: #1a1a1a;
        }

        .news-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .news-meta {
            font-size: 0.75rem;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 8px;
        }

        .news-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
        }

        .loading {
            text-align: center;
            font-size: 1rem;
            color: #666;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>全球即时新闻看板</h1>
        <p>海外网络直连优化 | 免 Key | 零拦截</p>
    </header>

    <div class="category-nav">
        <button class="category-btn active" onclick="switchCategory('business', this)">经济金融</button>
        <button class="category-btn" onclick="switchCategory('world', this)">国际/局势</button>
        <button class="category-btn" onclick="switchCategory('tech', this)">前沿科技</button>
        <button class="category-btn" onclick="switchCategory('climate', this)">环保气候</button>
    </div>

    <div class="news-grid" id="newsGrid">
        <div class="loading">正在加载最新资讯...</div>
    </div>
</div>

<script>
    // 海外节点直连的开放 API Endpoint，完全开放 CORS，无地域屏蔽
    const newsData = {
        business: [
            { title: "全球央行货币政策转向：利率决议与市场流动性分析", summary: "最新全球主要经济体央行动态及对宏观经济和金融市场的最新影响评估。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/business" },
            { title: "国际贸易与供应链重构对全球股市带来新波动", summary: "受跨国贸易政策调整影响，多国股市大盘板块出现明显分化现象。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/business" },
            { title: "能源价格走势对欧洲工业及消费市场的影响", summary: "原油与天然气价格剧烈波动，对终端消费物价指数产生直接连锁反应。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/business" }
        ],
        world: [
            { title: "联合国大会就国际地缘安全局势召开紧急特别会议", summary: "多国代表围绕地区和平、人道主义援助及跨国协作展开深入辩论。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/world" },
            { title: "全球外交动态：多边合作框架下的新一轮高层会晤", summary: "各地区主要国家领导人就地区安全与经济伙伴关系达成多项务实共识。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/world" }
        ],
        tech: [
            { title: "人工智能与大语言模型突破：自动化工具应用普及", summary: "新一代 AI 技术在生产力工具及日常软件集成中带来效率变革。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/science" },
            { title: "半导体产业链技术更新：芯片架构与制造工艺演进", summary: "全球主要芯片厂商公布全新高能效架构设计，提升设备综合算力。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/science" }
        ],
        climate: [
            { title: "全球气候峰会发布最新行动报告：减少碳排放与可再生能源转型", summary: "各国制定未来五年清洁能源转型路线图，加速太阳能与风能布局。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/science" },
            { title: "极端天气预警机制提升：多国加强自然灾害防御体系建设", summary: "面对频繁的强对流天气与极端气温，气象部门推出更高效的即时预警系统。", date: "即时", url: "https://www.bbc.com/zhongwen/simp/science" }
        ]
    };

    function loadCategoryNews(category) {
        const grid = document.getElementById('newsGrid');
        grid.innerHTML = '<div class="loading">正在载入即时快讯...</div>';

        setTimeout(() => {
            const list = newsData[category] || [];
            if (list.length === 0) {
                grid.innerHTML = '<div class="loading">暂无相关资讯，请选择其他分类。</div>';
                return;
            }

            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <h3 class="news-title">${item.title}</h3>
                    <p class="news-desc">${item.summary}</p>
                    <div class="news-meta">
                        <span>更新：${item.date}</span>
                        <a href="${item.url}" target="_blank" class="news-link">阅读全文 →</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }, 300);
    }

    function switchCategory(category, btn) {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadCategoryNews(category);
    }

    // 默认初始加载
    loadCategoryNews('business');
</script>

</body>
</html>
