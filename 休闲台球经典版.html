<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>檯球遊戲</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; padding:16px;
    background:radial-gradient(circle at 50% 30%, #2e2e38, #101018);
    font-family:"Microsoft JhengHei",sans-serif; color:#eee;
  }
  h1{ letter-spacing:6px; font-size:26px; color:#f0d59a; text-shadow:0 2px 6px #000; }
  #bar{ display:flex; align-items:center; gap:18px; font-size:15px; flex-wrap:wrap; justify-content:center; }
  #bar b{ color:#ffd76a; }
  #tray{ display:flex; gap:5px; min-height:18px; }
  .mini{ width:18px; height:18px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 3px rgba(0,0,0,.5); }
  button{
    background:linear-gradient(#3d6ea5,#274a72); color:#fff; border:none; border-radius:8px;
    padding:8px 20px; font-size:15px; cursor:pointer; font-family:inherit;
  }
  button:hover{ filter:brightness(1.15); }
  #wrap{ position:relative; }
  canvas{ display:block; width:min(94vw,1000px); border-radius:14px; box-shadow:0 14px 40px rgba(0,0,0,.6); cursor:crosshair; }
  #over{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); backdrop-filter:blur(3px); border-radius:14px;
  }
  #card{ background:#1c2230; border:1px solid #465; border-radius:14px; padding:34px 48px; text-align:center; }
  #card h2{ color:#ffd76a; margin-bottom:10px; letter-spacing:3px; }
  #card p{ margin-bottom:18px; font-size:17px; }
  #hint{ font-size:13px; color:#9aa; text-align:center; }
  #meterWrap{ width:min(94vw,1000px); height:10px; background:#222; border-radius:5px; overflow:hidden; }
  #mf{ height:100%; width:0%; background:linear-gradient(90deg,#4caf50,#ffc107,#e53935); transition:width .05s linear; }
</style>
</head>
<body>
<h1>檯球遊戲</h1>

<div id="bar">
  <span>已進球：<b id="cnt">0</b>/15</span>
  <div id="tray"></div>
  <span>桿數：<b id="sh">0</b></span>
  <button onclick="restart()">重新開始</button>
</div>

<div id="wrap">
  <canvas id="cv" width="1000" height="560"></canvas>
  <div id="over"><div id="card">
    <h2>過關！</h2>
    <p id="msg"></p>
    <button onclick="restart()">再玩一次</button>
  </div></div>
</div>

<div id="meterWrap"><div id="mf"></div></div>
<p id="hint">移動滑鼠瞄準，按住拖曳拉桿決定力道（往後拉），放開擊球！把 15 顆球全打進洞。</p>

<script>
const W=1000,H=560,R=13;
const T={x:70,y:70,w:860,h:420};
const PR=24;
const P=[
  {x:T.x,y:T.y},{x:T.x+T.w/2,y:T.y},{x:T.x+T.w,y:T.y},
  {x:T.x,y:T.y+T.h},{x:T.x+T.w/2,y:T.y+T.h},{x:T.x+T.w,y:T.y+T.h}
];
const COLORS={1:'#f7c331',2:'#1f5fbf',3:'#d1342f',4:'#6a2c91',5:'#e86a17',6:'#1d7a43',7:'#8c2f39',8:'#1b1b1b'};
const colorOf=n=>n<=8?COLORS[n]:COLORS[n-8];

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

let balls=[],cue=null,potted=[],shots=0,phase='AIM';
let mouse={x:0,y:0,in:false},charging=false,power=0,dir={x:1,y:0};

function setup(){
  balls=[];potted=[];shots=0;
  cue={n:0,x:T.x+T.w*0.25,y:T.y+T.h/2,vx:0,vy:0,in:false};
  balls.push(cue);
  const order=[1,2,9,3,8,10,4,14,7,11,12,6,15,13,5];
  const ax=T.x+T.w*0.72,cy=T.y+T.h/2,dx=Math.sqrt(3)*R+0.6,dy=2*R+0.6;
  let k=0;
  for(let r=0;r<5;r++)for(let c=0;c<=r;c++){
    balls.push({n:order[k++],x:ax+r*dx,y:cy+(c-r/2)*dy,vx:0,vy:0,in:false});
  }
  phase='AIM';
  document.getElementById('over').style.display='none';
  updTray();
}

function tone(f,dur,type,g){
  try{
    if(!tone.c)tone.c=new (window.AudioContext||window.webkitAudioContext)();
    const o=tone.c.createOscillator(),v=tone.c.createGain();
    o.type=type||'sine';o.frequency.value=f;
    v.gain.setValueAtTime(g||0.06,tone.c.currentTime);
    v.gain.exponentialRampToValueAtTime(0.0001,tone.c.currentTime+dur);
    o.connect(v).connect(tone.c.destination);
    o.start();o.stop(tone.c.currentTime+dur);
  }catch(e){}
}

function pot(b){
  b.in=true;b.vx=b.vy=0;
  if(b.n>0)potted.push(b.n);
  else setTimeout(()=>respot(),600);
  tone(520,.12,'sine',.08);setTimeout(()=>tone(330,.16,'sine',.07),80);
  updTray();
}

function respot(){
  let x=T.x+T.w*0.25,y=T.y+T.h/2;
  while(balls.some(o=>o!==cue&&!o.in&&Math.hypot(o.x-x,o.y-y)<2*R+2)&&x>T.x+2*R)x-=4;
  cue.in=false;cue.x=x;cue.y=y;cue.vx=cue.vy=0;
}

function updTray(){
  document.getElementById('cnt').textContent=potted.length;
  const t=document.getElementById('tray');
  t.innerHTML='';
  potted.slice().sort((a,b)=>a-b).forEach(n=>{
    const d=document.createElement('div');d.className='mini';
    d.style.background=n>8
      ?`linear-gradient(transparent 32%, ${colorOf(n)} 32%, ${colorOf(n)} 68%, transparent 68%)`
      :colorOf(n);
    d.title=n;t.appendChild(d);
  });
}

function step(dt){
  if(phase==='WIN')return;
  for(const b of balls){
    if(b.in)continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    const f=Math.exp(-0.85*dt);
    b.vx*=f;b.vy*=f;
    if(Math.hypot(b.vx,b.vy)<6)b.vx=b.vy=0;
    let sunk=false;
    for(const p of P){
      if(Math.hypot(b.x-p.x,b.y-p.y)<PR){pot(b);sunk=true;break;}
    }
    if(sunk)continue;
    if(b.x-R<T.x&&b.vx<0){b.x=T.x+R;b.vx*=-0.75;tone(150,.04,'triangle',.03);}
    if(b.x+R>T.x+T.w&&b.vx>0){b.x=T.x+T.w-R;b.vx*=-0.75;tone(150,.04,'triangle',.03);}
    if(b.y-R<T.y&&b.vy<0){b.y=T.y+R;b.vy*=-0.75;tone(150,.04,'triangle',.03);}
    if(b.y+R>T.y+T.h&&b.vy>0){b.y=T.y+T.h-R;b.vy*=-0.75;tone(150,.04,'triangle',.03);}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j];
    if(a.in||b.in)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>0&&d<2*R){
      const nx=dx/d,ny=dy/d,ov=(2*R-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rv>0){
        const jm=rv*0.97;
        a.vx-=jm*nx;a.vy-=jm*ny;b.vx+=jm*nx;b.vy+=jm*ny;
        tone(Math.min(700,240+rv*.4),.05,'triangle',Math.min(.09,rv/9000));
      }
    }
  }
}

function castRay(x,y,dx,dy){
  let best={t:1e9,hit:null};
  for(const b of balls){
    if(b===cue||b.in)continue;
    const ex=b.x-x,ey=b.y-y,prj=ex*dx+ey*dy;
    if(prj<=0)continue;
    const per2=ex*ex+ey*ey-prj*prj,rr=(2*R)*(2*R);
    if(per2>=rr)continue;
    const t=prj-Math.sqrt(rr-per2);
    if(t>0&&t<best.t)best={t,hit:b};
  }
  const walls=[];
  if(dx<0)walls.push((T.x+R-x)/dx);
  if(dx>0)walls.push((T.x+T.w-R-x)/dx);
  if(dy<0)walls.push((T.y+R-y)/dy);
  if(dy>0)walls.push((T.y+T.h-R-y)/dy);
  for(const t of walls)if(t>0&&t<best.t){best={t:t,hit:null};}
  return best;
}

function pos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}

cv.addEventListener('pointermove',e=>{
  const p=pos(e);mouse=p;mouse.in=true;
  let dx=p.x-cue.x,dy=p.y-cue.y,d=Math.hypot(dx,dy)||1;
  if(charging){dx=-dx;dy=-dy;}
  dir={x:dx/d,y:dy/d};
  power=charging?Math.min(Math.max((d-2*R)/220,0),1):power;
  document.getElementById('mf').style.width=(power*100)+'%';
});
cv.addEventListener('pointerleave',()=>mouse.in=false);
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  charging=true;power=0;
});
cv.addEventListener('pointerup',()=>{
  if(!charging)return;
  charging=false;
  document.getElementById('mf').style.width='0%';
  if(phase==='AIM'&&power>0.03){
    const sp=200+power*1550;
    cue.vx=dir.x*sp;cue.vy=dir.y*sp;
    shots++;phase='RUN';
    document.getElementById('sh').textContent=shots;
    tone(190,.07,'square',.05);
  }
  power=0;
});

function checkTurnEnd(){
  if(phase!=='RUN')return;
  if(balls.some(b=>!b.in&&(b.vx||b.vy)))return;
  phase='AIM';
  if(potted.length>=15){
    phase='WIN';
    document.getElementById('msg').textContent=`全部進袋！總共用了 ${shots} 桿`;
    document.getElementById('over').style.display='flex';
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function drawTable(){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#6b4423');g.addColorStop(.5,'#8a5a2b');g.addColorStop(1,'#5a3819');
  ctx.fillStyle=g;rr(20,20,W-40,H-40,26);ctx.fill();
  ctx.strokeStyle='#3a2410';ctx.lineWidth=4;rr(20,20,W-40,H-40,26);ctx.stroke();
  ctx.fillStyle='#136c37';
  rr(T.x-14,T.y-14,T.w+28,T.h+28,12);ctx.fill();
  const felt=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,560);
  felt.addColorStop(0,'#1a9a52');felt.addColorStop(1,'#0e6b38');
  ctx.fillStyle=felt;
  ctx.fillRect(T.x,T.y,T.w,T.h);
  ctx.strokeStyle='#0a5129';ctx.lineWidth=3;ctx.strokeRect(T.x,T.y,T.w,T.h);
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(T.x+T.w*0.25,T.y);ctx.lineTo(T.x+T.w*0.25,T.y+T.h);ctx.stroke();
  ctx.fillStyle='#e8e0c8';
  ctx.beginPath();ctx.arc(T.x+T.w*0.25,T.y+T.h/2,3.5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(T.x+T.w*0.72,T.y+T.h/2,3.5,0,7);ctx.fill();
  for(const p of P){
    ctx.fillStyle='#0c0f14';
    ctx.beginPath();ctx.arc(p.x,p.y,PR-3,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,215,106,.45)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(p.x,p.y,PR-3,0,7);ctx.stroke();
  }
}

function drawBall(b){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(b.x+3,b.y+4,R*0.95,R*0.75,0,0,7);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.clip();
  if(b.n===0){
    ctx.fillStyle='#f6f2e8';ctx.fillRect(b.x-R,b.y-R,2*R,2*R);
  }else if(b.n>8){
    ctx.fillStyle='#f6f2e8';ctx.fillRect(b.x-R,b.y-R,2*R,2*R);
    ctx.fillStyle=colorOf(b.n);
    ctx.fillRect(b.x-R,b.y-R*0.58,2*R,R*1.16);
  }else{
    ctx.fillStyle=colorOf(b.n);ctx.fillRect(b.x-R,b.y-R,2*R,2*R);
  }
  const hl=ctx.createRadialGradient(b.x-R*0.35,b.y-R*0.4,1,b.x-R*0.35,b.y-R*0.4,R*1.4);
  hl.addColorStop(0,'rgba(255,255,255,.85)');hl.addColorStop(0.35,'rgba(255,255,255,.15)');hl.addColorStop(1,'rgba(0,0,0,.25)');
  ctx.fillStyle=hl;ctx.fillRect(b.x-R,b.y-R,2*R,2*R);
  if(b.n>0){
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(b.x,b.y,R*0.52,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.n,b.x,b.y+0.5);
  }
  ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.stroke();
}

function drawAim(){
  if(phase!=='AIM'||!mouse.in)return;
  const ray=castRay(cue.x,cue.y,dir.x,dir.y);
  const hx=cue.x+dir.x*Math.min(ray.t,2000),hy=cue.y+dir.y*Math.min(ray.t,2000);
  ctx.save();
  ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,.8)';
  ctx.beginPath();ctx.arc(hx,hy,R,0,7);ctx.stroke();
  if(ray.hit){
    const bx=ray.hit.x-hx,by=ray.hit.y-hy,bd=Math.hypot(bx,by)||1;
    ctx.strokeStyle='rgba(255,210,80,.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(ray.hit.x,ray.hit.y);
    ctx.lineTo(ray.hit.x+bx/bd*42,ray.hit.y+by/bd*42);ctx.stroke();
  }
  ctx.restore();
}

function drawCueStick(){
  if(phase!=='AIM'||!mouse.in)return;
  const pull=(charging?power*110:0)+26;
  const bx=cue.x-dir.x*(R+pull),by=cue.y-dir.y*(R+pull);
  const tx=bx-dir.x*280,ty=by-dir.y*280;
  const g=ctx.createLinearGradient(tx,ty,bx,by);
  g.addColorStop(0,'#2c1c10');g.addColorStop(0.55,'#a5713d');g.addColorStop(1,'#e8d3ac');
  ctx.save();
  ctx.lineCap='round';ctx.lineWidth=charging?8:7;
  ctx.strokeStyle=g;
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;ctx.shadowOffsetY=4;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx,by);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#4fa3d1';
  ctx.beginPath();ctx.arc(bx,by,3.5,0,7);ctx.fill();
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-last)/1000,0.04);last=now;
  const sub=3;
  for(let i=0;i<sub;i++)step(dt/sub);
  checkTurnEnd();
  ctx.clearRect(0,0,W,H);
  drawTable();
  drawAim();
  for(const b of balls)if(!b.in)drawBall(b);
  drawCueStick();
}
setup();
requestAnimationFrame(loop);

function restart(){setup();document.getElementById('sh').textContent=0;}
</script>
</body>
</html>
