// === 游戏核心控制逻辑 ===
let questionsPerGame = 10;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let isAnswering = false;

// 页面加载完成后自动获取并显示现有题库总数
window.onload = function() {
    const totalCount = fullQuestionBank.length;
    document.getElementById('bank-info').innerText = `已成功载入 ${totalCount} 道精选题目，测试你的知识极限`;
};

function startGame() {
    const shuffled = [...fullQuestionBank].sort(() => 0.5 - Math.random());
    currentQuestions = shuffled.slice(0, questionsPerGame);
    currentIndex = 0;
    score = 0;
    switchScreen('quiz-screen');
    loadQuestion();
}

function loadQuestion() {
    isAnswering = false;
    const q = currentQuestions[currentIndex];
    document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questionsPerGame}`;
    document.getElementById('score-text').innerText = score;
    document.getElementById('progress-bar').style.width = `${((currentIndex) / questionsPerGame) * 100}%`;
    document.getElementById('question-text').innerText = q.question;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    const prefixes = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<strong>${prefixes[idx]}.</strong> ${opt}`;
        btn.onclick = () => handleAnswer(idx, q.answer, btn);
        container.appendChild(btn);
    });
}

function handleAnswer(selected, correct, btn) {
    if (isAnswering) return;
    isAnswering = true;
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score-text').innerText = score;
    } else {
        btn.classList.add('wrong');
        allBtns[correct].classList.add('correct');
    }
    setTimeout(nextQuestion, 1200);
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) loadQuestion();
    else endGame();
}

function endGame() {
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('final-score').innerText = score;
    document.getElementById('feedback-text').innerText = score >= 70 ? "太棒了！知识面非常广博！" : "继续加油！再试一次吧！";
    switchScreen('result-screen');
}

function resetGame() { switchScreen('start-screen'); }
function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>
